name: Python SRE Compliance CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Run Built-In Unittest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Execute Compliance & SLO Tests
        run: python3 -m unittest discover -s tests -p "test_*.py" -v
